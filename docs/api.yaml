openapi: 3.1.0
info:
  title: TutorHub API
  version: 0.5.0
  description: |
    Backend for the TutorHub Telegram Mini App: a catalogue of teachers, tutors and
    consultants in Kazakhstan (Almaty first).

    ## Auth
    Every endpoint except `/health` requires `Authorization: tma <initData>` (the raw
    `Telegram.WebApp.initData` string). When the server runs with `APP_ENV=dev`,
    `Authorization: dev <telegram_id>` is also accepted.

    The public website (`/t/{id}`, `/c/{city}`, `/c/{city}/{subject}`, `/sitemap.xml`,
    `/robots.txt`) is server-rendered HTML served by the same backend and is not part of
    this contract.

    ## Conventions
    - All timestamps are RFC 3339 with an offset, in the app time zone (`Asia/Almaty`).
    - `date` values (`YYYY-MM-DD`) are calendar dates in the app time zone.
    - Lists are plain JSON arrays unless stated otherwise.
    - Errors always use the `Error` schema: `{"error": "<code>", "message": "<text>"}`.
      Switch on `error`; `message` is for humans and may change.

    ## Specialist profiles
    A user has at most one specialist profile (`kind`: teacher or consultant).
    Status: `draft` -> (`POST /my/specialist/submit`) `pending` -> admin approves -> `live`
    (or rejects -> back to `draft` with `rejection_reason`). The teacher can pause a live
    profile: `live` <-> `hidden`. Admins can block (`blocked`).

    **Visibility rule:** a specialist is listed in search iff `status = live` AND a
    subscription is running now (`starts_at <= now < ends_at`). Approval starts a `trial`
    plan (default 30 days) or a `founding` plan until a date the admin sets. A live profile
    without a running subscription is not listed, but its page (`GET /specialists/{id}`) still
    opens for anyone with the link (`listed: false`). The exact `address` is shown only to the
    owner and admins.

    Ranking: featured plan first, then those with free time in the next 7 days, then the most
    recently approved.

    ## Subscriptions
    Plans: `founding` (free, until a date admins set), `trial` (free, on approval), `basic` and
    `featured` (paid monthly; prices from configuration, see `GET /plans`). Payment is a manual
    Kaspi transfer; an admin then activates the plan. `featured` ranks first and shows a badge.
    The worker reminds the teacher 7 days and 1 day before their last plan ends and tells them
    when they leave search.

    ## Trust
    Reviews: one per student per teacher, only after a completed lesson, editable; admins can
    hide them. `rating` is the average of published reviews (one decimal) and ranks after
    "free this week". Reports go to admins. Admins can block a profile (with a reason the owner
    sees) or a user (every request then gets 403). Verified badge: the teacher uploads documents
    (PDF/JPEG/PNG, at most 5) that only admins can download, asks for verification, and an admin
    grants or refuses the badge.

    ## Statistics
    Events per specialist: `view` (profile opened by someone else), `search_impression` (shown in
    a search page), `contact` (`POST /specialists/{id}/contact`), `request` (lesson requested).
    Weeks start on Monday in the app time zone.

    ## Availability and lessons
    A teacher sets a weekly template (`weekday` 0 = Sunday ... 6 = Saturday, `HH:MM` windows,
    `24:00` allowed as an end) and days off. Free slots start every 30 minutes inside a window,
    last the subject's `lesson_minutes`, start at least 1 hour from now and at most 30 days ahead,
    and do not overlap the teacher's pending or confirmed lessons.

    Lesson lifecycle: `pending` (request; holds the slot until `expires_at` =
    min(now + HOLD_MINUTES, start)) -> `confirmed` | `declined` (teacher, in the app or with the
    bot's buttons) | `expired` (no answer in time) | `cancelled` (either side). `confirmed` ->
    `completed` after it ends, or `cancelled`. Only `pending` and `confirmed` lessons hold time;
    the database rejects overlaps per teacher and per student. Every response reports the
    *effective* status (an overdue `pending` reads as `expired`, an ended `confirmed` as
    `completed`). The student sees the teacher's `address` once a lesson is confirmed.

    ## Error codes
    | code | HTTP | when |
    |------|------|------|
    | `bad_request` | 400 | Malformed JSON, missing or invalid parameters. |
    | `unauthorized` | 401 | Missing, malformed, expired or badly signed `Authorization` header. |
    | `forbidden` | 403 | The current user may not do this (admin endpoints for non-admins; editing a blocked profile). A blocked user gets 403 on every authenticated endpoint. |
    | `not_found` | 404 | The resource does not exist or is not visible to the current user. Unknown routes. |
    | `method_not_allowed` | 405 | Wrong HTTP method for an existing path. |
    | `invalid_status` | 409 | The profile's status does not allow this action (e.g. submit when not `draft`, approve when not `pending`, hide when not `live`). |
    | `profile_incomplete` | 422 | `POST /my/specialist/submit`: required fields are missing; `message` lists them. |
    | `invalid_photo` | 422 | `POST /my/specialist/photo`: not a JPEG/PNG/WebP image, empty, or over 5 MB. |
    | `slot_taken` | 409 | `POST /lessons`: the teacher already has a pending or confirmed lesson overlapping this time. |
    | `student_busy` | 409 | `POST /lessons`: the student already has a pending or confirmed lesson (with anyone) overlapping this time. |
    | `not_pending` | 409 | Teacher confirm/decline of a lesson that is not `pending` (decided, cancelled or past `expires_at`). |
    | `not_cancellable` | 409 | Cancel of a lesson that is not pending/confirmed, has started, or (student) is confirmed and closer to the start than the teacher's `cancel_hours`. |
    | `own_profile` | 422 | `POST /lessons` to yourself. |
    | `subject_not_offered` | 422 | `POST /lessons`: the teacher does not teach `subject_id`. |
    | `trial_unavailable` | 422 | `POST /lessons` with `is_trial`: the teacher offers no trial, or the student already had one with them. |
    | `outside_availability` | 422 | `POST /lessons`: `starts_at` is not a slot of the teacher's weekly template (30-minute grid, lesson fits a window, not a day off) or is more than 30 days ahead. |
    | `too_soon` | 422 | `POST /lessons`: `starts_at` is less than 1 hour from now. |
    | `no_completed_lesson` | 422 | `PUT /specialists/{id}/review` without a completed lesson with that teacher. |
    | `invalid_document` | 422 | `POST /my/specialist/documents`: not a PDF/JPEG/PNG, over 10 MB, or more than 5 documents. |
    | `no_documents` | 422 | `POST /my/specialist/verification` before uploading a document. |
    | `internal` | 500 | Unexpected server error. |
    | `unavailable` | 503 | `/health`: the database is unreachable. |
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api

security:
  - telegramInitData: []

tags:
  - name: system
    description: Health check and the current user.
  - name: catalogue
    description: Subjects, vocabularies and the specialist catalogue.
  - name: my-profile
    description: The current user's own specialist profile.
  - name: lessons
    description: Free slots and the student's lessons.
  - name: teacher
    description: The teacher's schedule, requests and students.
  - name: subscriptions
    description: Plans, prices and the teacher's subscription.
  - name: stats
    description: Teacher statistics and the admin dashboard.
  - name: trust
    description: Reviews, reports and the verified badge.
  - name: admin
    description: Admin-only endpoints (users.role = admin).

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: The API and the database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ok }
        "503": { $ref: "#/components/responses/Unavailable" }

  /me:
    get:
      tags: [system]
      operationId: getMe
      summary: The current user
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /subjects:
    get:
      tags: [catalogue]
      operationId: listSubjects
      summary: The subject taxonomy
      description: Every subject, ordered by category and position. Names come in ru, kk and en.
      responses:
        "200":
          description: All subjects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /meta:
    get:
      tags: [catalogue]
      operationId: getMeta
      summary: Cities, districts and fixed vocabularies
      responses:
        "200":
          description: The vocabularies used by filters and the profile editor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /specialists:
    get:
      tags: [catalogue]
      operationId: searchSpecialists
      summary: Search the catalogue
      description: |
        Only listed specialists (see the visibility rule). Subject, level and price filters
        must all match the same subject offer. `q` matches name, bio and subject names.
      parameters:
        - { name: subject_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: language, in: query, schema: { $ref: "#/components/schemas/Language" } }
        - { name: format, in: query, schema: { $ref: "#/components/schemas/Format" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/Kind" } }
        - { name: city, in: query, schema: { type: string, example: almaty } }
        - { name: district, in: query, schema: { type: string, example: bostandyk } }
        - { name: price_min, in: query, schema: { type: integer, minimum: 0, maximum: 1000000 } }
        - { name: price_max, in: query, schema: { type: integer, minimum: 0, maximum: 1000000 } }
        - { name: verified, in: query, description: Only verified specialists., schema: { type: boolean } }
        - { name: free_this_week, in: query, description: Only those with free time in the next 7 days., schema: { type: boolean } }
        - { name: rating_min, in: query, description: Minimum average rating., schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: One page of results and the total count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecialistPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /specialists/{id}:
    get:
      tags: [catalogue]
      operationId: getSpecialist
      summary: A specialist's public profile
      description: Opens for anyone while the profile is `live` (listed or not); always for the owner and admins.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecialistPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /my/specialist:
    get:
      tags: [my-profile]
      operationId: getMySpecialist
      summary: The current user's own profile
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [my-profile]
      operationId: saveMySpecialist
      summary: Create or update the current user's profile
      description: |
        Creates a `draft` on first call. Replaces every editable field and the subject list.
        The status does not change (a live profile stays live).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecialistInput" }
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /my/specialist/submit:
    post:
      tags: [my-profile]
      operationId: submitMySpecialist
      summary: Send a draft for verification
      description: |
        Requires display_name, a bio of at least 30 characters, at least one subject (each with
        at least one level), formats, languages, and a district for offline formats.
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }
        "422": { $ref: "#/components/responses/ProfileIncomplete" }

  /my/specialist/hide:
    post:
      tags: [my-profile]
      operationId: hideMySpecialist
      summary: Pause a live profile (live -> hidden)
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }

  /my/specialist/unhide:
    post:
      tags: [my-profile]
      operationId: unhideMySpecialist
      summary: Bring a hidden profile back (hidden -> live)
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }

  /my/specialist/photo:
    post:
      tags: [my-profile]
      operationId: uploadMySpecialistPhoto
      summary: Upload or replace the profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPEG, PNG or WebP, at most 5 MB." }
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`invalid_photo`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /files/photos/{name}:
    get:
      tags: [catalogue]
      operationId: getPhoto
      summary: A profile photo (public, cached forever)
      security: []
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /specialists/{id}/slots:
    get:
      tags: [lessons]
      operationId: getSpecialistSlots
      summary: Free lesson slots
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: subject_id, in: query, description: Use this subject's lesson length (default the profile's)., schema: { type: integer, format: int64, minimum: 1 } }
        - { name: from, in: query, description: First local date (default today; earlier dates are clamped to today)., schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
      responses:
        "200":
          description: Free slots per local date (dates past the 30-day horizon are omitted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slots" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lessons:
    post:
      tags: [lessons]
      operationId: requestLesson
      summary: Request a lesson in a free slot
      description: Creates a `pending` lesson and sends the teacher ✅/❌ buttons in the bot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialist_id, subject_id, starts_at]
              additionalProperties: false
              properties:
                specialist_id: { type: integer, format: int64 }
                subject_id: { type: integer, format: int64 }
                starts_at: { type: string, format: date-time }
                is_trial: { type: boolean, default: false }
                note: { type: string, maxLength: 500, description: "Message to the teacher (goal, level, ...)." }
      responses:
        "201":
          description: The pending lesson.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LessonConflict" }
        "422": { $ref: "#/components/responses/LessonUnprocessable" }

  /lessons/my:
    get:
      tags: [lessons]
      operationId: myLessons
      summary: The student's lessons
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
          description: "`upcoming`: pending or confirmed, soonest first. `past`: everything else, newest first. At most 100."
      responses:
        "200":
          description: Lessons.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lesson" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /lessons/{id}/cancel:
    post:
      tags: [lessons]
      operationId: cancelMyLesson
      summary: Cancel the student's own lesson
      description: A pending request any time before the start; a confirmed lesson until `cancel_hours` before the start.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200":
          description: The cancelled lesson.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LessonStateConflict" }

  /teacher/lessons:
    get:
      tags: [teacher]
      operationId: teacherLessons
      summary: The teacher's lessons
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [requests, upcoming, past], default: upcoming }
          description: "`requests`: pending only. `upcoming`: pending or confirmed. `past`: the rest. At most 100."
      responses:
        "200":
          description: Lessons with student details.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lesson" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teacher/lessons/{id}/confirm:
    post:
      tags: [teacher]
      operationId: confirmLesson
      summary: Confirm a pending request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/TeacherLesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LessonStateConflict" }

  /teacher/lessons/{id}/decline:
    post:
      tags: [teacher]
      operationId: declineLesson
      summary: Decline a pending request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/TeacherLesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LessonStateConflict" }

  /teacher/lessons/{id}/cancel:
    post:
      tags: [teacher]
      operationId: teacherCancelLesson
      summary: Cancel an upcoming lesson as the teacher
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/TeacherLesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LessonStateConflict" }

  /teacher/students:
    get:
      tags: [teacher]
      operationId: teacherStudents
      summary: Everyone who requested a lesson from the teacher
      description: Ordered by the next confirmed lesson, then the last completed one.
      responses:
        "200":
          description: Students.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Student" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teacher/students/{studentId}/note:
    put:
      tags: [teacher]
      operationId: setStudentNote
      summary: Save the teacher's private note about a student
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teacher/availability:
    get:
      tags: [teacher]
      operationId: getAvailability
      summary: The teacher's weekly template and upcoming days off
      responses:
        "200": { $ref: "#/components/responses/Availability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teacher/availability/rules:
    put:
      tags: [teacher]
      operationId: setAvailabilityRules
      summary: Replace the weekly template
      description: Windows are multiples of 15 minutes and must not overlap on the same weekday. Existing lessons are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              additionalProperties: false
              properties:
                rules: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AvailabilityRule" } }
      responses:
        "200": { $ref: "#/components/responses/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teacher/availability/days-off/{day}:
    parameters:
      - { name: day, in: path, required: true, schema: { type: string, format: date } }
    put:
      tags: [teacher]
      operationId: addDayOff
      summary: Mark a local date as a day off (today .. one year ahead)
      responses:
        "200": { $ref: "#/components/responses/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [teacher]
      operationId: removeDayOff
      summary: Remove a day off
      responses:
        "200": { $ref: "#/components/responses/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /specialists/{id}/contact:
    post:
      tags: [catalogue]
      operationId: contactSpecialist
      summary: Get a link to the specialist's Telegram chat (counted as a lead)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Where to send the user.
          content:
            application/json:
              schema:
                type: object
                required: [telegram_url]
                additionalProperties: false
                properties:
                  telegram_url: { type: string, example: "https://t.me/aigerim_math", description: "https://t.me/<username>, or tg://user?id=<id> without a username." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /favourites:
    get:
      tags: [catalogue]
      operationId: listFavourites
      summary: The user's favourite specialists (live ones), newest first
      responses:
        "200":
          description: Favourites.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf: [{ $ref: "#/components/schemas/SpecialistCard" }]
                  unevaluatedProperties: false
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /favourites/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [catalogue]
      operationId: addFavourite
      summary: Save a specialist (idempotent)
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [catalogue]
      operationId: removeFavourite
      summary: Remove a saved specialist (idempotent)
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plans:
    get:
      tags: [subscriptions]
      operationId: getPlans
      summary: Paid plans, prices and how to pay
      responses:
        "200":
          description: The price list.
          content:
            application/json:
              schema:
                type: object
                required: [plans, payment_instructions]
                additionalProperties: false
                properties:
                  plans:
                    type: array
                    items:
                      type: object
                      required: [plan, price_kzt]
                      additionalProperties: false
                      properties:
                        plan: { type: string, enum: [basic, featured] }
                        price_kzt: { type: integer, description: Per month. }
                  payment_instructions: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/subscription:
    get:
      tags: [subscriptions]
      operationId: teacherSubscription
      summary: The teacher's plan, coverage and history
      responses:
        "200": { $ref: "#/components/responses/SubscriptionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teacher/stats:
    get:
      tags: [stats]
      operationId: teacherStats
      summary: Views, search appearances, contacts, requests and lessons per week
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 52, default: 8 } }
      responses:
        "200":
          description: Oldest week first; the last one is the current week.
          content:
            application/json:
              schema:
                type: object
                required: [weeks, totals]
                additionalProperties: false
                properties:
                  weeks: { type: array, items: { $ref: "#/components/schemas/StatsWeek" } }
                  totals: { $ref: "#/components/schemas/StatsWeek" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/specialists/{id}/subscriptions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [admin]
      operationId: adminSubscriptions
      summary: A specialist's subscriptions
      responses:
        "200": { $ref: "#/components/responses/SubscriptionState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin]
      operationId: adminActivateSubscription
      summary: Activate or extend a plan
      description: |
        Give exactly one of `months` or `ends_on`. With `months` the plan is an extension: it
        starts when the specialist's running or future subscription of the same plan ends (or now).
        With `ends_on` it starts now and lasts through that local date. The teacher is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              additionalProperties: false
              properties:
                plan: { $ref: "#/components/schemas/Plan" }
                months: { type: integer, minimum: 1, maximum: 24 }
                ends_on: { type: string, format: date }
                note: { type: string, maxLength: 300, description: "E.g. the Kaspi payment reference." }
      responses:
        "200": { $ref: "#/components/responses/SubscriptionState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/subscriptions/{id}/end:
    post:
      tags: [admin]
      operationId: adminEndSubscription
      summary: End a subscription now (a future one is deleted)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/SubscriptionState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/subscriptions/expiring:
    get:
      tags: [admin]
      operationId: adminExpiring
      summary: Live specialists whose last plan ends within `days`
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
      responses:
        "200":
          description: Soonest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [specialist_id, display_name, owner, plan, ends_at]
                  additionalProperties: false
                  properties:
                    specialist_id: { type: integer, format: int64 }
                    display_name: { type: string }
                    owner: { $ref: "#/components/schemas/Person" }
                    plan: { $ref: "#/components/schemas/Plan" }
                    ends_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/founding-period:
    post:
      tags: [admin]
      operationId: adminSetFoundingPeriod
      summary: Move the end of every running founding plan to `ends_on`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_on]
              additionalProperties: false
              properties:
                ends_on: { type: string, format: date }
      responses:
        "200":
          description: How many plans changed.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                additionalProperties: false
                properties:
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/dashboard:
    get:
      tags: [admin]
      operationId: adminDashboard
      summary: Teachers by status, plans, searches and requests per day, unmet demand
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /specialists/{id}/reviews:
    get:
      tags: [trust]
      operationId: listReviews
      summary: Published reviews of a specialist, newest first (at most 100)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Reviews.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /specialists/{id}/review:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [trust]
      operationId: myReview
      summary: The current user's review of this specialist and whether they may write one
      responses:
        "200":
          description: The review state.
          content:
            application/json:
              schema:
                type: object
                required: [can_review, review, hidden]
                additionalProperties: false
                properties:
                  can_review: { type: boolean, description: True after a completed lesson (or when a review exists). }
                  review: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Review" }] }
                  hidden: { type: boolean, description: Hidden by a moderator. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [trust]
      operationId: saveReview
      summary: Create or edit the current user's review (needs a completed lesson)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              additionalProperties: false
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The saved review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`no_completed_lesson`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [trust]
      operationId: deleteReview
      summary: Delete the current user's review (idempotent)
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /specialists/{id}/report:
    post:
      tags: [trust]
      operationId: reportSpecialist
      summary: Report a profile to the admins
      description: While the user's earlier report on this profile is open, the same report is returned.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, enum: [fake, inappropriate, spam, no_show, other] }
                text: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /my/specialist/documents:
    get:
      tags: [trust]
      operationId: myDocuments
      summary: The teacher's verification documents (metadata only)
      responses:
        "200":
          description: Documents.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Document" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [trust]
      operationId: uploadDocument
      summary: Upload a verification document (PDF, JPEG or PNG, at most 10 MB, at most 5)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`invalid_document`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /my/specialist/documents/{id}:
    delete:
      tags: [trust]
      operationId: deleteDocument
      summary: Delete one of the teacher's documents
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /my/specialist/verification:
    post:
      tags: [trust]
      operationId: requestVerification
      summary: Ask admins to verify the uploaded documents
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }
        "422":
          description: "`no_documents`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/reviews:
    get:
      tags: [admin]
      operationId: adminReviews
      summary: Reviews by status, newest first (at most 200)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [published, hidden], default: published } }
      responses:
        "200":
          description: Reviews.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminReview" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/reviews/{id}/hide:
    post:
      tags: [admin]
      operationId: adminHideReview
      summary: Hide a review
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/AdminReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/reviews/{id}/unhide:
    post:
      tags: [admin]
      operationId: adminUnhideReview
      summary: Publish a hidden review again
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/AdminReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/reports:
    get:
      tags: [admin]
      operationId: adminReports
      summary: Reports by status, newest first (at most 200)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed], default: open } }
      responses:
        "200":
          description: Reports.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Report" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/reports/{id}/resolve:
    post:
      tags: [admin]
      operationId: adminResolveReport
      summary: Close a report
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [resolved, dismissed] }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{telegramId}/block:
    post:
      tags: [admin]
      operationId: adminBlockUser
      summary: Block a user (every request then gets 403); admins cannot be blocked
      parameters:
        - { name: telegramId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: Blocked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{telegramId}/unblock:
    post:
      tags: [admin]
      operationId: adminUnblockUser
      summary: Unblock a user
      parameters:
        - { name: telegramId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: Unblocked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/specialists/{id}/block:
    post:
      tags: [admin]
      operationId: adminBlockSpecialist
      summary: Block a profile (any status -> blocked) with a reason the owner sees
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }

  /admin/specialists/{id}/unblock:
    post:
      tags: [admin]
      operationId: adminUnblockSpecialist
      summary: Unblock a profile (back to live if it was ever approved, else draft)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }

  /admin/verifications:
    get:
      tags: [admin]
      operationId: adminVerifications
      summary: Profiles waiting for document verification, with their documents
      responses:
        "200":
          description: Requests, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [specialist, documents]
                  additionalProperties: false
                  properties:
                    specialist: { $ref: "#/components/schemas/SpecialistPrivate" }
                    documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/specialists/{id}/verification:
    post:
      tags: [admin]
      operationId: adminDecideVerification
      summary: Grant or refuse the verified badge
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              additionalProperties: false
              properties:
                approve: { type: boolean }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/documents/{id}/file:
    get:
      tags: [admin]
      operationId: adminDownloadDocument
      summary: Download a verification document (admins only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/specialists:
    get:
      tags: [admin]
      operationId: adminListSpecialists
      summary: Profiles by status (the verification queue)
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SpecialistStatus" }
          description: Default `pending`. Oldest submission first, at most 200.
      responses:
        "200":
          description: Matching profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpecialistPrivate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/specialists/{id}:
    get:
      tags: [admin]
      operationId: adminGetSpecialist
      summary: Any profile, full view
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/specialists/{id}/approve:
    post:
      tags: [admin]
      operationId: adminApproveSpecialist
      summary: Approve a pending profile (pending -> live)
      description: |
        Starts `plan` unless a subscription is already running. `trial` lasts `TRIAL_DAYS`
        (default 30) unless `ends_on` is given; `founding` needs `ends_on` (last included day).
        The teacher is notified in the bot. The body is optional.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plan: { type: string, enum: [trial, founding], default: trial }
                ends_on: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }

  /admin/specialists/{id}/reject:
    post:
      tags: [admin]
      operationId: adminRejectSpecialist
      summary: Send a pending profile back to draft with a reason
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/MySpecialist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidStatus" }

components:
  securitySchemes:
    telegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `tma <initData>` with the raw `Telegram.WebApp.initData` string.
        Only when the server runs with `APP_ENV=dev`: `dev <telegram_id>`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 1

  requestBodies:
    Reason:
      description: Optional reason shown to the other side.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 500 }

  responses:
    LessonConflict:
      description: "`slot_taken` or `student_busy`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            slot_taken: { value: { error: slot_taken, message: "this time is already taken" } }
            student_busy: { value: { error: student_busy, message: "you already have a lesson at that time" } }
    LessonStateConflict:
      description: "`not_pending` or `not_cancellable`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            not_pending: { value: { error: not_pending, message: "lesson request is no longer pending" } }
            not_cancellable: { value: { error: not_cancellable, message: "lesson can no longer be cancelled" } }
    LessonUnprocessable:
      description: "`own_profile`, `subject_not_offered`, `trial_unavailable`, `outside_availability` or `too_soon`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: outside_availability, message: "this time is outside the teacher's working hours" }
    TeacherLesson:
      description: The lesson, with student details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Lesson" }
    AdminReview:
      description: The review.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminReview" }
    SubscriptionState:
      description: Visibility and subscriptions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SubscriptionState" }
    Availability:
      description: The weekly template and upcoming days off.
      content:
        application/json:
          schema:
            type: object
            required: [rules, days_off]
            additionalProperties: false
            properties:
              rules: { type: array, items: { $ref: "#/components/schemas/AvailabilityRule" } }
              days_off: { type: array, items: { type: string, format: date } }
    BadRequest:
      description: "`bad_request`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: bad_request, message: "invalid JSON body" }
    Unauthorized:
      description: "`unauthorized`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthorized, message: "missing or malformed Authorization header" }
    Forbidden:
      description: "`forbidden`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: forbidden, message: "admins only" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: not_found, message: "resource not found" }
    InvalidStatus:
      description: "`invalid_status`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid_status, message: "this action is not allowed in the profile's current status" }
    ProfileIncomplete:
      description: "`profile_incomplete`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: profile_incomplete, message: "profile is incomplete: bio (at least 30 characters), subjects" }
    MySpecialist:
      description: The full profile.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SpecialistPrivate" }
    Unavailable:
      description: "`unavailable`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unavailable, message: "database is unreachable" }

  schemas:
    Error:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - invalid_status
            - profile_incomplete
            - invalid_photo
            - slot_taken
            - student_busy
            - not_pending
            - not_cancellable
            - own_profile
            - subject_not_offered
            - trial_unavailable
            - outside_availability
            - too_soon
            - no_completed_lesson
            - invalid_document
            - no_documents
            - internal
            - unavailable
        message: { type: string }

    Me:
      type: object
      required: [telegram_id, name, username, language_code, role, is_admin, specialist]
      additionalProperties: false
      properties:
        telegram_id: { type: integer, format: int64 }
        name: { type: string }
        username: { type: [string, "null"] }
        language_code: { type: [string, "null"], description: "From Telegram, e.g. ru, kk, en." }
        role: { type: string, enum: [user, admin] }
        is_admin: { type: boolean }
        specialist:
          description: The user's own specialist profile, or null.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SpecialistSummary"

    Subject:
      type: object
      required: [id, slug, name_ru, name_kk, name_en, category]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, example: ent-math }
        name_ru: { type: string, example: "ЕНТ: математика" }
        name_kk: { type: string, example: "ҰБТ: математика" }
        name_en: { type: string, example: "UNT: mathematics" }
        category:
          type: string
          enum: [school, exam, language, it, music, arts, consulting, other]

    Level:
      type: string
      enum: [primary, middle, high, ent, university, adult]
      description: "primary = grades 1-4, middle = 5-9, high = 10-11, ent = UNT/ENT prep, university, adult."
    Language:
      type: string
      enum: [kk, ru, en]
    Format:
      type: string
      enum: [online, teacher_place, student_home]
    Kind:
      type: string
      enum: [teacher, consultant]
    SpecialistStatus:
      type: string
      enum: [draft, pending, live, hidden, blocked]
    Plan:
      type: string
      enum: [founding, trial, basic, featured]

    Place:
      type: object
      required: [slug, name_ru, name_kk, name_en]
      additionalProperties: false
      properties:
        slug: { type: string }
        name_ru: { type: string }
        name_kk: { type: string }
        name_en: { type: string }

    Meta:
      type: object
      required: [cities, levels, formats, languages, kinds]
      additionalProperties: false
      properties:
        cities:
          type: array
          items:
            type: object
            required: [slug, name_ru, name_kk, name_en, districts]
            additionalProperties: false
            properties:
              slug: { type: string, example: almaty }
              name_ru: { type: string }
              name_kk: { type: string }
              name_en: { type: string }
              districts:
                type: array
                items: { $ref: "#/components/schemas/Place" }
        levels: { type: array, items: { $ref: "#/components/schemas/Level" } }
        formats: { type: array, items: { $ref: "#/components/schemas/Format" } }
        languages: { type: array, items: { $ref: "#/components/schemas/Language" } }
        kinds: { type: array, items: { $ref: "#/components/schemas/Kind" } }

    Offer:
      type: object
      description: One subject a specialist teaches.
      required: [subject_id, slug, name_ru, name_kk, name_en, levels, price_kzt, lesson_minutes]
      additionalProperties: false
      properties:
        subject_id: { type: integer, format: int64 }
        slug: { type: string }
        name_ru: { type: string }
        name_kk: { type: string }
        name_en: { type: string }
        levels: { type: array, items: { $ref: "#/components/schemas/Level" } }
        price_kzt: { type: integer, minimum: 0, description: Price per lesson in KZT. }
        lesson_minutes: { type: integer, description: Lesson length for this subject. }

    SpecialistCard:
      type: object
      required: [id, kind, display_name, photo_url, verified, featured, city, district, formats, languages,
                 experience_years, trial_kind, trial_price, min_price_kzt, rating, reviews_count, subjects]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/Kind" }
        display_name: { type: string }
        photo_url: { type: [string, "null"], example: /api/files/photos/12-0123456789abcdef.jpg }
        verified: { type: boolean, description: Documents checked by an admin. }
        featured: { type: boolean, description: Featured plan running now. }
        city: { type: string }
        district: { type: string, description: District slug or empty. }
        formats: { type: array, items: { $ref: "#/components/schemas/Format" } }
        languages: { type: array, items: { $ref: "#/components/schemas/Language" } }
        experience_years: { type: integer }
        trial_kind: { type: string, enum: [none, free, paid] }
        trial_price: { type: [integer, "null"], description: Only for a paid trial. }
        min_price_kzt: { type: [integer, "null"], description: Cheapest subject price; null without subjects. }
        rating: { type: [number, "null"], description: "Average of published reviews (one decimal); null without reviews." }
        reviews_count: { type: integer }
        subjects: { type: array, items: { $ref: "#/components/schemas/Offer" } }

    SpecialistPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            allOf: [{ $ref: "#/components/schemas/SpecialistCard" }]
            unevaluatedProperties: false
        total: { type: integer, description: Matches across all pages. }

    SpecialistPublicFields:
      type: object
      required: [bio, education, lesson_minutes, cancel_hours, address, listed, favourite]
      properties:
        bio: { type: string }
        education: { type: string }
        lesson_minutes: { type: integer, description: Default lesson length. }
        cancel_hours: { type: integer, description: Students may cancel a confirmed lesson until this many hours before it. }
        address: { type: [string, "null"], description: "Exact address; for the owner, admins and students with a confirmed lesson." }
        listed: { type: boolean, description: Shown in search right now. }
        favourite: { type: boolean, description: The current user saved this specialist. }

    SpecialistPublic:
      allOf:
        - $ref: "#/components/schemas/SpecialistCard"
        - $ref: "#/components/schemas/SpecialistPublicFields"
      unevaluatedProperties: false

    Subscription:
      type: object
      required: [id, plan, starts_at, ends_at, note]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        plan: { $ref: "#/components/schemas/Plan" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: Exclusive; local midnight after the last day. }
        note: { type: string }

    SpecialistPrivate:
      description: The full profile, for its owner and admins.
      allOf:
        - $ref: "#/components/schemas/SpecialistCard"
        - $ref: "#/components/schemas/SpecialistPublicFields"
        - type: object
          required: [status, rejection_reason, submitted_at, approved_at, lat, lng, subscription, personal_link, owner,
                     verification_status, verification_note, block_reason]
          properties:
            status: { $ref: "#/components/schemas/SpecialistStatus" }
            rejection_reason: { type: [string, "null"] }
            submitted_at: { type: [string, "null"], format: date-time }
            approved_at: { type: [string, "null"], format: date-time }
            lat: { type: [number, "null"] }
            lng: { type: [number, "null"] }
            subscription:
              description: The subscription running now, else the latest one, else null.
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/Subscription"
            personal_link: { type: [string, "null"], example: "https://t.me/tutorhub_bot?start=t_12" }
            verification_status: { type: string, enum: [none, requested, verified, rejected] }
            verification_note: { type: string, description: The admin's note on a refused verification. }
            block_reason: { type: string }
            owner:
              type: object
              required: [telegram_id, name, username]
              additionalProperties: false
              properties:
                telegram_id: { type: integer, format: int64 }
                name: { type: string }
                username: { type: [string, "null"] }
      unevaluatedProperties: false

    SpecialistSummary:
      type: object
      required: [id, status, display_name, listed]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/SpecialistStatus" }
        display_name: { type: string }
        listed: { type: boolean }

    SpecialistInput:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        display_name: { type: string, maxLength: 80 }
        bio: { type: string, maxLength: 2000 }
        education: { type: string, maxLength: 1000 }
        experience_years: { type: integer, minimum: 0, maximum: 70 }
        city: { type: string, default: almaty }
        district: { type: string }
        address: { type: string, maxLength: 200 }
        lat: { type: [number, "null"] }
        lng: { type: [number, "null"] }
        formats: { type: array, items: { $ref: "#/components/schemas/Format" } }
        languages: { type: array, items: { $ref: "#/components/schemas/Language" } }
        trial_kind: { type: string, enum: [none, free, paid], default: none }
        trial_price: { type: [integer, "null"], minimum: 0 }
        lesson_minutes: { type: integer, minimum: 30, maximum: 240, default: 60, description: Multiple of 15. }
        cancel_hours: { type: [integer, "null"], minimum: 0, maximum: 72, default: 12 }
        subjects:
          type: array
          maxItems: 20
          items:
            type: object
            required: [subject_id, price_kzt]
            additionalProperties: false
            properties:
              subject_id: { type: integer, format: int64 }
              levels: { type: array, items: { $ref: "#/components/schemas/Level" } }
              price_kzt: { type: integer, minimum: 0, maximum: 1000000 }
              lesson_minutes: { type: [integer, "null"], minimum: 30, maximum: 240, description: "Override; null = the profile default." }

    AvailabilityRule:
      type: object
      required: [weekday, starts_at, ends_at]
      additionalProperties: false
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday ... 6 = Saturday. }
        starts_at: { type: string, pattern: "^([01][0-9]|2[0-4]):[0-5][0-9]$", example: "16:00" }
        ends_at: { type: string, pattern: "^([01][0-9]|2[0-4]):[0-5][0-9]$", example: "20:00" }

    Slots:
      type: object
      required: [specialist_id, lesson_minutes, days]
      additionalProperties: false
      properties:
        specialist_id: { type: integer, format: int64 }
        lesson_minutes: { type: integer }
        days:
          type: array
          items:
            type: object
            required: [date, slots]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              slots:
                type: array
                items:
                  type: object
                  required: [starts_at, ends_at]
                  additionalProperties: false
                  properties:
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }

    Person:
      type: object
      required: [telegram_id, name, username]
      additionalProperties: false
      properties:
        telegram_id: { type: integer, format: int64 }
        name: { type: string }
        username: { type: [string, "null"] }

    Lesson:
      type: object
      required: [id, status, starts_at, ends_at, expires_at, is_trial, price_kzt, note, cancelled_by, cancel_reason,
                 created_at, can_cancel, subject, specialist]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, confirmed, declined, cancelled, expired, completed] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: Only while pending. }
        is_trial: { type: boolean }
        price_kzt: { type: integer, description: Price agreed at request time (0 for a free trial). }
        note: { type: string }
        cancelled_by: { type: [string, "null"], enum: [student, teacher, null] }
        cancel_reason: { type: string }
        created_at: { type: string, format: date-time }
        can_cancel: { type: boolean, description: Whether the current viewer may cancel it now. }
        subject:
          type: object
          required: [id, slug, name_ru, name_kk, name_en]
          additionalProperties: false
          properties:
            id: { type: integer, format: int64 }
            slug: { type: string }
            name_ru: { type: string }
            name_kk: { type: string }
            name_en: { type: string }
        specialist:
          type: object
          required: [id, display_name, photo_url, address]
          additionalProperties: false
          properties:
            id: { type: integer, format: int64 }
            display_name: { type: string }
            photo_url: { type: [string, "null"] }
            address: { type: [string, "null"], description: "Student view: the teacher's address once confirmed. Teacher view: null." }
        student:
          $ref: "#/components/schemas/Person"
          description: Teacher views only.

    Student:
      type: object
      required: [telegram_id, name, username, lessons, requests, next_lesson_at, last_lesson_at, note]
      additionalProperties: false
      properties:
        telegram_id: { type: integer, format: int64 }
        name: { type: string }
        username: { type: [string, "null"] }
        lessons: { type: integer, description: Confirmed or completed lessons. }
        requests: { type: integer, description: Every request ever made. }
        next_lesson_at: { type: [string, "null"], format: date-time }
        last_lesson_at: { type: [string, "null"], format: date-time }
        note: { type: string, description: The teacher's private note. }

    SubscriptionState:
      type: object
      required: [specialist_id, listed, current, coverage_ends_at, history]
      additionalProperties: false
      properties:
        specialist_id: { type: integer, format: int64 }
        listed: { type: boolean }
        current:
          description: The running plan (featured wins if several run), or null.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Subscription"
        coverage_ends_at: { type: [string, "null"], format: date-time, description: End of the last running or future plan. }
        history: { type: array, items: { $ref: "#/components/schemas/Subscription" }, description: "Newest end first, at most 50." }

    StatsWeek:
      type: object
      required: [week_start, views, search_impressions, contacts, requests, lessons]
      additionalProperties: false
      properties:
        week_start: { type: string, format: date, description: "Monday (totals: the first week)." }
        views: { type: integer }
        search_impressions: { type: integer }
        contacts: { type: integer }
        requests: { type: integer }
        lessons: { type: integer, description: Confirmed or completed lessons starting that week. }

    DayCount:
      type: object
      required: [date, count]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    Dashboard:
      type: object
      required: [users, specialists_by_status, listed, plans_running, expiring_7d, searches_per_day, requests_per_day, unmet_demand]
      additionalProperties: false
      properties:
        users: { type: integer }
        specialists_by_status:
          type: object
          required: [draft, pending, live, hidden, blocked]
          additionalProperties: false
          properties:
            draft: { type: integer }
            pending: { type: integer }
            live: { type: integer }
            hidden: { type: integer }
            blocked: { type: integer }
        listed: { type: integer }
        plans_running:
          type: object
          required: [founding, trial, basic, featured]
          additionalProperties: false
          properties:
            founding: { type: integer }
            trial: { type: integer }
            basic: { type: integer }
            featured: { type: integer }
        expiring_7d: { type: integer }
        searches_per_day: { type: array, items: { $ref: "#/components/schemas/DayCount" } }
        requests_per_day: { type: array, items: { $ref: "#/components/schemas/DayCount" } }
        unmet_demand:
          description: Subjects searched in the last 30 days with fewer than 3 listed specialists, fewest first.
          type: array
          items:
            type: object
            required: [subject_id, slug, name_ru, searches, listed_specialists]
            additionalProperties: false
            properties:
              subject_id: { type: integer, format: int64 }
              slug: { type: string }
              name_ru: { type: string }
              searches: { type: integer }
              listed_specialists: { type: integer }

    Review:
      type: object
      required: [id, rating, text, author_name, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        author_name: { type: string, description: The student's first name. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminReview:
      type: object
      required: [id, rating, text, author_name, created_at, updated_at, status, specialist, student_id]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        rating: { type: integer }
        text: { type: string }
        author_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { type: string, enum: [published, hidden] }
        specialist: { $ref: "#/components/schemas/SpecialistRef" }
        student_id: { type: integer, format: int64 }

    SpecialistRef:
